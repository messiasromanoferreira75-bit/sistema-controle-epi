<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de EPIs</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#182230;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#14324b;color:white;padding:1.3rem max(1rem,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:1.45rem}header p{margin:.3rem 0 0;color:#c9d8e5}main{max-width:1100px;margin:1.5rem auto;padding:0 1rem}.tabs{display:flex;gap:.5rem;overflow:auto;margin-bottom:1rem}button,.tab{font:inherit;border:0;border-radius:.55rem;padding:.65rem .9rem;cursor:pointer;background:#e4eaf0;color:#263849}.tab.active,button.primary{background:#176b87;color:white}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns: minmax(0,1.25fr) minmax(280px,.75fr);gap:1rem}.card{background:white;border-radius:.8rem;padding:1rem 1.2rem;box-shadow:0 2px 10px #1822300d}h2{font-size:1.15rem;margin:.1rem 0 1rem}form{display:grid;gap:.7rem}label{display:grid;gap:.28rem;font-size:.92rem;font-weight:600}input,select{font:inherit;padding:.6rem .65rem;border:1px solid #cbd5df;border-radius:.45rem;width:100%}button{font-weight:650}button:hover,.tab:hover{filter:brightness(.96)}.row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.item-row{display:grid;grid-template-columns:1fr 95px auto;gap:.5rem;align-items:end;margin:.55rem 0}.item-row button{background:#f3e7e7;color:#9b2929}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}th,td{text-align:left;padding:.65rem .55rem;border-bottom:1px solid #e7edf2;white-space:nowrap}th{color:#526273;font-size:.82rem}.low{background:#fff2d8}.message{display:none;margin:0 0 1rem;padding:.75rem 1rem;border-radius:.55rem}.message.show{display:block}.message.success{background:#e2f5e9;color:#145b2b}.message.error{background:#fde7e7;color:#8b2020}.muted{color:#607080;font-size:.9rem}.actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}header{padding:1rem}main{margin:1rem auto}.item-row{grid-template-columns:1fr 82px auto}}
</style>
</head><body>
<header><h1>Controle de Equipamentos de Proteção</h1><p>Cadastro, estoque e registro de entregas de EPIs</p></header>
<main>
<div id="message" class="message" role="status" aria-live="polite"></div>
<nav class="tabs" aria-label="Seções"><button class="tab active" data-tab="setores">Setores</button><button class="tab" data-tab="funcionarios">Funcionários</button><button class="tab" data-tab="epis">EPIs</button><button class="tab" data-tab="entrega">Nova entrega</button></nav>
<section class="panel active" id="setores"><div class="grid"><article class="card"><h2>Setores cadastrados</h2><div id="setores-lista" class="table-wrap"></div></article><article class="card"><h2>Cadastrar setor</h2><form id="setor-form"><label>Nome do setor<input name="nome" maxlength="120" required></label><button class="primary">Salvar setor</button></form></article></div></section>
<section class="panel" id="funcionarios"><div class="grid"><article class="card"><h2>Funcionários</h2><div id="funcionarios-lista" class="table-wrap"></div></article><article class="card"><h2>Cadastrar funcionário</h2><form id="funcionario-form"><label>Nome<input name="nome" maxlength="120" required></label><label>Matrícula<input name="matricula" maxlength="120" required></label><label>Cargo<input name="cargo" maxlength="120"></label><label>Setor<select name="id_setor" required></select></label><button class="primary">Salvar funcionário</button></form></article></div></section>
<section class="panel" id="epis"><div class="grid"><article class="card"><h2>Estoque de EPIs</h2><p class="muted">Linhas destacadas estão no limite mínimo ou abaixo dele.</p><div id="epis-lista" class="table-wrap"></div></article><article class="card"><h2>Cadastrar EPI</h2><form id="epi-form"><label>Nome<input name="nome" maxlength="120" required></label><label>Tipo<input name="tipo" maxlength="120"></label><label>CA (Certificado de Aprovação)<input name="ca" maxlength="20"></label><div class="row"><label>Estoque<input name="estoque" type="number" min="0" value="0" required></label><label>Estoque mínimo<input name="estoque_minimo" type="number" min="0" value="0" required></label></div><button class="primary">Salvar EPI</button></form></article></div></section>
<section class="panel" id="entrega"><div class="grid"><article class="card"><h2>Itens da entrega</h2><div id="itens"></div><div class="actions"><button id="adicionar-item" type="button">+ Adicionar EPI</button></div></article><article class="card"><h2>Registrar entrega</h2><form id="entrega-form"><label>Funcionário<select name="id_funcionario" required></select></label><label>Responsável pela entrega<select name="id_responsavel" required></select></label><label>Caminho da assinatura (opcional)<input name="assinatura_path" maxlength="500"></label><button class="primary">Registrar entrega</button></form></article></div></section>
</main>
<script>
const API='http://localhost:8000'; const $=s=>document.querySelector(s); let setores=[],funcionarios=[],epis=[];
function mensagem(texto,tipo='success'){const el=$('#message');el.textContent=texto;el.className=`message show ${tipo}`;window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>el.classList.remove('show'),6000)}
async function requisicao(path,options={}){let res;try{res=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}})}catch(e){throw new Error('Não foi possível conectar à API. Confira se o servidor está iniciado em http://localhost:8000.')};let data;try{data=await res.json()}catch{data={}}if(!res.ok)throw new Error(data.detail||data.mensagem||`Erro HTTP ${res.status}`);return data}
function tabela(cols,rows){if(!rows.length)return '<p class="muted">Nenhum registro encontrado.</p>';return `<table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r._baixo?'low':''}">${cols.map(c=>`<td>${escapeHtml(c.value(r)??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function carregarSetores(){setores=await requisicao('/setores');$('#setores-lista').innerHTML=tabela([{label:'ID',value:r=>r.id_setor},{label:'Nome',value:r=>r.nome}],setores);$('#funcionario-form [name=id_setor]').innerHTML='<option value="">Selecione…</option>'+setores.map(s=>`<option value="${s.id_setor}">${escapeHtml(s.nome)}</option>`).join('')}
async function carregarFuncionarios(){funcionarios=await requisicao('/funcionarios');$('#funcionarios-lista').innerHTML=tabela([{label:'Nome',value:r=>r.nome},{label:'Matrícula',value:r=>r.matricula},{label:'Cargo',value:r=>r.cargo},{label:'Setor',value:r=>r.setor_nome}],funcionarios);for(const name of ['id_funcionario','id_responsavel'])$(`#entrega-form [name=${name}]`).innerHTML='<option value="">Selecione…</option>'+funcionarios.map(f=>`<option value="${f.id}">${escapeHtml(f.nome)} (${escapeHtml(f.matricula)})</option>`).join('')}
async function carregarEpis(){epis=await requisicao('/epis');$('#epis-lista').innerHTML=tabela([{label:'Nome',value:r=>r.nome},{label:'Tipo',value:r=>r.tipo},{label:'CA',value:r=>r.ca},{label:'Estoque',value:r=>r.estoque},{label:'Mínimo',value:r=>r.estoque_minimo} ],epis.map(e=>({...e,_baixo:e.estoque<=e.estoque_minimo})));}
function linhaItem(){const div=document.createElement('div');div.className='item-row';div.innerHTML=`<label>EPI<select class="epi-id" required><option value="">Selecione…</option>${epis.map(e=>`<option value="${e.id_epi}">${escapeHtml(e.nome)} (disp.: ${e.estoque})</option>`).join('')}</select></label><label>Qtd.<input class="qtd" type="number" min="1" value="1" required></label><button type="button" aria-label="Remover item">Remover</button>`;div.querySelector('button').onclick=()=>{if($('#itens').children.length>1)div.remove();else mensagem('A entrega precisa ter pelo menos um item.','error')};return div}
$('#adicionar-item').onclick=()=>$('#itens').append(linhaItem());
for(const tab of document.querySelectorAll('.tab'))tab.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));tab.classList.add('active');$('#'+tab.dataset.tab).classList.add('active');if(tab.dataset.tab==='entrega')$('#itens').innerHTML='',$('#itens').append(linhaItem())};
async function enviar(form,path,transform=x=>x,success='Cadastro realizado com sucesso.'){form.onsubmit=async e=>{e.preventDefault();try{await requisicao(path,{method:'POST',body:JSON.stringify(transform(Object.fromEntries(new FormData(form))))});mensagem(success);form.reset();await atualizar()}catch(err){mensagem(err.message,'error')}}}
enviar($('#setor-form'),'/setores',x=>x,'Setor cadastrado com sucesso.');
enviar($('#funcionario-form'),'/funcionarios',x=>({...x,id_setor:Number(x.id_setor),cargo:x.cargo||null}),'Funcionário cadastrado com sucesso.');
enviar($('#epi-form'),'/epis',x=>({...x,tipo:x.tipo||null,ca:x.ca||null,estoque:Number(x.estoque),estoque_minimo:Number(x.estoque_minimo)}),'EPI cadastrado com sucesso.');
$('#entrega-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const itens=[...$('#itens').children].map(x=>({id_epi:Number(x.querySelector('.epi-id').value),quantidade:Number(x.querySelector('.qtd').value)}));if(itens.some(i=>!i.id_epi)){mensagem('Selecione um EPI para cada item.','error');return}try{const data=await requisicao('/entregas',{method:'POST',body:JSON.stringify({id_funcionario:Number(f.id_funcionario.value),id_responsavel:Number(f.id_responsavel.value),assinatura_path:f.assinatura_path.value||null,itens})});mensagem(data.mensagem||'Entrega registrada com sucesso.');f.reset();$('#itens').innerHTML='';$('#itens').append(linhaItem());await atualizar()}catch(err){mensagem(err.message,'error')}};
async function atualizar(){try{await Promise.all([carregarSetores(),carregarFuncionarios(),carregarEpis()])}catch(err){mensagem(err.message,'error')}}$('#itens').append(linhaItem());atualizar();
</script></body></html>
